spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    show-sql: false
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}

logging:
  level:
    root: INFO
    "[com.example.task_tracker]": INFO