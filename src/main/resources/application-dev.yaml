spring:
  datasource:
    url: jdbc:h2:file:./data/task_tracker;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  jpa:
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.example.task_tracker: DEBUG
    "[org.hibernate.SQL]": debug
app:
  jwt:
    # DEV ONLY — at least 32 characters for HS256
    secret: "dev-secret-key-change-me-at-least-32-characters-long"
    expiry-seconds: 3600