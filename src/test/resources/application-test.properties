# --- DataSource (H2 in-memory for tests) ---
spring.datasource.url=jdbc:h2:mem:tasktracker_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# --- Flyway: disable in tests if it conflicts with ddl-auto=create-drop ---
spring.flyway.enabled=false

# --- JWT (must match what JwtProperties expects) ---
# Open com.example.task_tracker.security.JwtProperties and copy its field names.
app.jwt.secret=test-secret-that-is-long-enough-for-hmac-sha256-at-least-32-bytes
app.jwt.expiration-ms=3600000